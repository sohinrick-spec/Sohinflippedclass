/* ===================== 基礎工具 ===================== */
function getHKDateString(d){const b=d||new Date();const u=b.getTime()+b.getTimezoneOffset()*6e4;const h=new Date(u+288e5);
  return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;}
function getHKHour(){const u=Date.now()+new Date().getTimezoneOffset()*6e4;return new Date(u+288e5).getHours();}
function getGreeting(){const h=getHKHour();
  if(h<6)return{text:'夜深了',emoji:'🌙'};if(h<12)return{text:'早晨',emoji:'☀️'};if(h<14)return{text:'午安',emoji:'🌤️'};
  if(h<18)return{text:'下午好',emoji:'🌞'};if(h<22)return{text:'晚上好',emoji:'🌆'};return{text:'夜安',emoji:'🌙'};}
function isOverdue(s){return s? getHKDateString()>s : false;}
function daysUntilDue(s){if(!s)return null;return Math.round((new Date(s)-new Date(getHKDateString()))/864e5);}
function fmtPct(p){return `${Math.round(p||0)}%`;}
function fmtDur(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function fmtMin(sec){const m=(sec||0)/60;return m>=10?`${Math.round(m)} 分`:`${m.toFixed(1)} 分`;}
function fmtDT(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('zh-HK',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return '—';}}
function fmtRel(iso){if(!iso)return '從未';const t=Date.parse(iso);if(!t)return '從未';
  const d=Date.now()-t;if(d<6e4)return '剛剛';if(d<36e5)return `${Math.floor(d/6e4)} 分鐘前`;
  if(d<864e5)return `${Math.floor(d/36e5)} 小時前`;if(d<2592e6)return `${Math.floor(d/864e5)} 天前`;return fmtDT(iso);}
function avgOf(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function sumOf(a){return a.reduce((x,y)=>x+(y||0),0);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function parseUsername(full){
  if(!full)return{displayName:'',form:null,grade:null,number:null};
  const s=String(full).trim();
  let m=s.match(/^(.+?)\s*\(\d{2}-\d{2}\)\s*([4-6][A-Z])(\d+)\s*$/i);
  if(m)return{displayName:m[1].trim(),form:m[2].toUpperCase(),grade:m[2][0],number:m[3]};
  m=s.match(/^([4-6][A-Z])(\d+)\s+(.+?)\s*(?:\(\d{2}-\d{2}\))?\s*$/i);
  if(m)return{displayName:m[3].trim(),form:m[1].toUpperCase(),grade:m[1][0],number:m[2]};
  m=s.match(/^(.+?)\s*\(([4-6][A-Z]\d+)\)\s*$/i);
  if(m){const c=m[2].toUpperCase();return{displayName:m[1].trim(),form:c.slice(0,2),grade:c[0],number:c.slice(2)};}
  return{displayName:s,form:null,grade:null,number:null};
}
function shortenName(n){if(!n)return '';return parseUsername(String(n)).displayName||String(n).trim();}
function getInitials(n){const name=shortenName(n);if(!name)return '?';const p=name.split(/\s+/).filter(Boolean);
  if(!p.length)return '?';if(p.length===1)return p[0].slice(0,2).toUpperCase();return (p[0][0]+p[p.length-1][0]).toUpperCase();}
function parseUserForm(n){return parseUsername(n).form;}
function matchesTargetForm(tf,uf){
  if(!tf||!String(tf).trim()||String(tf).trim().toUpperCase()==='ALL')return true;
  if(!uf)return false;
  const T=String(tf).trim().toUpperCase(),U=String(uf).trim().toUpperCase();
  if(T===U)return true;
  const g=T.match(/^(?:[F中]?)([4-6])$/i);
  if(g&&U[0]===g[1])return true;
  if(T.includes(','))return T.split(',').map(x=>x.trim()).some(t=>t===U||(/^[4-6]$/.test(t)&&U[0]===t));
  return false;
}
function normName(n){return n?shortenName(n).toLowerCase().trim().split(/\s+/).filter(Boolean).sort().join(' '):'';}
const TEACHER_SET=new Set(CONFIG.TEACHER_NAMES.map(normName));
function isTeacher(n){if(!n||n==='訪客 (未登入)')return false;const x=normName(n);return !!x&&TEACHER_SET.has(x);}
function sortStudentCmp(a,b){
  const ga=Number(a.grade||9),gb=Number(b.grade||9);
  if(ga!==gb)return ga-gb;
  const fa=a.form||'ZZ',fb=b.form||'ZZ';
  if(fa!==fb)return fa.localeCompare(fb);
  const na=Number(a.number||999),nb=Number(b.number||999);
  if(na!==nb)return na-nb;
  return String(a.name).localeCompare(String(b.name));
}
function isAssignedLesson(l){
  if(!l)return false;
  if(l.dueDate&&String(l.dueDate).trim()!=='')return true;
  if(l.id&&String(l.id).startsWith('lesson_'))return true;
  return false;
}
function decodeJwt(t){const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));}
function loadYouTubeAPI(){return new Promise(res=>{
  if(window.YT&&window.YT.Player){res(window.YT);return;}
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res(window.YT);};
  if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);}
});}
function isScriptConfigured(){const u=CONFIG.GOOGLE_SCRIPT_URL||'';
  return u.length>0&&!u.includes('YOUR_SCRIPT')&&u.startsWith('https://script.google.com/');}
function watchPctColor(p){return (!p||p<30)?'text-red-500 dark:text-red-400':p<CONFIG.VIDEO_COMPLETE_THRESHOLD?'text-amber-500 dark:text-amber-400':'text-green-500 dark:text-green-400';}
function watchPctBg(p){return (!p||p<30)?'bg-red-500':p<CONFIG.VIDEO_COMPLETE_THRESHOLD?'bg-amber-500':'bg-green-500';}
function watchPctGradient(p){return (!p||p<30)?'from-red-400 to-rose-500':p<CONFIG.VIDEO_COMPLETE_THRESHOLD?'from-amber-400 to-orange-500':'from-green-400 to-emerald-500';}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch{}ta.remove();return Promise.resolve();
}
function downloadCSV(filename,rows){
  const csv=rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ===================== 觀看片段編碼 ===================== */
function secsToRanges(set){
  const arr=[...set].sort((a,b)=>a-b);const out=[];let s=null,p=null;
  arr.forEach(v=>{if(s===null){s=v;p=v;}else if(v===p+1){p=v;}else{out.push([s,p]);s=v;p=v;}});
  if(s!==null)out.push([s,p]);return out;
}
function rangesToStr(r){return r.map(([a,b])=>a===b?`${a}`:`${a}-${b}`).join(',');}
function parseRanges(str){
  if(!str)return[];
  return String(str).split(',').map(t=>{const [a,b]=t.split('-');const s=Number(a);const e=b===undefined?s:Number(b);
    return (isFinite(s)&&isFinite(e)&&e>=s)?[s,e]:null;}).filter(Boolean);
}
function rangesCoverage(r){return r.reduce((a,[s,e])=>a+(e-s+1),0);}

/* ===================== 進度紀錄邏輯 ===================== */
function isAnswerCorrect(q,a){
  if(a===undefined||a===null||a==='')return false;
  if(q.type==='mcq')return String(a)===String(q.answer);
  if(!q.answer)return true;
  const n=v=>String(v||'').toLowerCase().replace(/\s+/g,'');
  return n(a)===n(q.answer);
}
function countCorrect(lesson,answers){
  const qs=lesson.questions||[];
  return qs.filter(q=>isAnswerCorrect(q,answers?.[q.id])).length;
}
function computeStatus(lesson,p){
  if(!p)return 'not_started';
  if(p.completedAt)return 'completed';
  const answered=p.answers?Object.keys(p.answers).length:0;
  if(answered>0)return 'answering';
  if((p.watchPct||0)>=CONFIG.VIDEO_COMPLETE_THRESHOLD)return 'watched';
  if((p.watchPct||0)>0)return 'watching';
  return 'not_started';
}
function computeFlags(lesson,p){
  const f=[];if(!p)return f;
  if(p.completedAt&&lesson.dueDate&&String(p.completedAt).slice(0,10)>lesson.dueDate)
    f.push({k:'late',label:'逾期完成',cls:'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-300'});
  if((p.maxRate||1)>=CONFIG.SUSPECT_RATE)
    f.push({k:'rate',label:`${p.maxRate}× 加速`,cls:'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300'});
  if((p.seekCount||0)>=CONFIG.SUSPECT_SEEK)
    f.push({k:'seek',label:`拖動 ${p.seekCount} 次`,cls:'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300'});
  if((p.focusLoss||0)>=4)
    f.push({k:'focus',label:`離開 ${p.focusLoss} 次`,cls:'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-300'});
  if((p.durationSec||0)>60&&(p.watchPct||0)>=85&&(p.totalWatchSec||0)<p.durationSec*0.45)
    f.push({k:'skip',label:'疑似跳看',cls:'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-300'});
  return f;
}
function normalizeRecord(r){
  if(!r||typeof r!=='object')return null;
  const o={...r};
  ['watchPct','watchedSec','durationSec','totalWatchSec','sessions','seekCount','focusLoss','lastPosition','correct','totalQ']
    .forEach(k=>o[k]=Number(o[k]||0));
  o.maxRate=Number(o.maxRate||1)||1;
  o.score=(o.score===''||o.score==null)?null:Number(o.score);
  if(typeof o.answers==='string'){try{o.answers=JSON.parse(o.answers)||{};}catch{o.answers={};}}
  if(!o.answers||typeof o.answers!=='object')o.answers={};
  if(typeof o.heat==='string'){try{o.heat=JSON.parse(o.heat)||[];}catch{o.heat=[];}}
  if(!Array.isArray(o.heat))o.heat=[];
  o.segments=o.segments?String(o.segments):'';
  o.completedAt=o.completedAt||'';
  return o;
}
function mergeRecords(a,b){
  if(!a)return b;if(!b)return a;
  const ta=Date.parse(a.lastViewAt||a.savedAt||0)||0, tb=Date.parse(b.lastViewAt||b.savedAt||0)||0;
  const base=tb>ta?{...a,...b}:{...b,...a};
  base.watchPct=Math.max(a.watchPct||0,b.watchPct||0);
  base.watchedSec=Math.max(a.watchedSec||0,b.watchedSec||0);
  base.totalWatchSec=Math.max(a.totalWatchSec||0,b.totalWatchSec||0);
  base.sessions=Math.max(a.sessions||0,b.sessions||0);
  base.seekCount=Math.max(a.seekCount||0,b.seekCount||0);
  base.focusLoss=Math.max(a.focusLoss||0,b.focusLoss||0);
  base.maxRate=Math.max(a.maxRate||1,b.maxRate||1);
  base.durationSec=Math.max(a.durationSec||0,b.durationSec||0);
  base.completedAt=a.completedAt||b.completedAt||'';
  base.answers={...(a.answers||{}),...(b.answers||{})};
  base.segments=((a.segments||'').length>=(b.segments||'').length)?a.segments:b.segments;
  const ha=a.heat||[],hb=b.heat||[];
  base.heat=Array.from({length:Math.max(ha.length,hb.length)},(_,i)=>Math.max(ha[i]||0,hb[i]||0));
  return base;
}

/* ===================== 本機儲存（v2 單一 JSON） ===================== */
const LocalProgress={
  cache:null,
  read(){
    if(this.cache)return this.cache;
    let obj={};
    try{obj=JSON.parse(localStorage.getItem(CONFIG.STORAGE.progress)||'{}')||{};}catch{obj={};}
    // 舊格式遷移
    try{
      const del=[];
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(!k||!k.startsWith(CONFIG.STORAGE.legacyProgress))continue;
        const rest=k.slice(CONFIG.STORAGE.legacyProgress.length);
        const idx=rest.lastIndexOf('_');if(idx<0)continue;
        const lid=rest.slice(0,idx),nm=rest.slice(idx+1);
        try{const v=JSON.parse(localStorage.getItem(k));if(v)obj[`${lid}::${nm}`]=normalizeRecord(v);}catch{}
        del.push(k);
      }
      if(del.length){del.forEach(k=>localStorage.removeItem(k));
        localStorage.setItem(CONFIG.STORAGE.progress,JSON.stringify(obj));}
    }catch{}
    this.cache=obj;return obj;
  },
  write(){try{localStorage.setItem(CONFIG.STORAGE.progress,JSON.stringify(this.cache||{}));}catch{}},
  get(lid,name){if(!lid||!name)return null;return this.read()[`${lid}::${name}`]||null;},
  set(lid,name,rec){
    if(!lid||!name||name==='訪客 (未登入)')return;
    const o=this.read();o[`${lid}::${name}`]={...rec,savedAt:new Date().toISOString()};this.cache=o;this.write();
  },
  nested(){
    const o=this.read(),out={};
    Object.entries(o).forEach(([k,v])=>{
      const i=k.indexOf('::');if(i<0)return;
      const lid=k.slice(0,i),nm=k.slice(i+2);
      if(!out[lid])out[lid]={};out[lid][nm]=normalizeRecord(v);
    });
    return out;
  }
};

/* ===================== 網絡寫入佇列（節流 + beacon flush） ===================== */
const SaveQueue={
  pending:new Map(), timer:null, lastError:null,
  push(key,payload,immediate){
    this.pending.set(key,payload);
    if(immediate){this.flush();return;}
    if(!this.timer)this.timer=setTimeout(()=>this.flush(),CONFIG.SAVE_THROTTLE_MS);
  },
  flush(beacon){
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
    if(!this.pending.size)return;
    const records=[...this.pending.values()];this.pending.clear();
    if(!isScriptConfigured())return;
    const body=JSON.stringify({action:'saveProgressBatch',appVersion:APP_VERSION,records});
    if(beacon&&navigator.sendBeacon){
      try{navigator.sendBeacon(CONFIG.GOOGLE_SCRIPT_URL,new Blob([body],{type:'text/plain;charset=utf-8'}));return;}catch{}
    }
    fetch(CONFIG.GOOGLE_SCRIPT_URL,{method:'POST',keepalive:true,redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body}).catch(e=>{this.lastError=e;});
  }
};

function ToastProvider({children}){

function useGoogleSignIn(userName,setUserName,enabled=true){
  const att=useRef(0);
  useEffect(()=>{
    if(!enabled)return;
    if(userName){document.body.classList.add('logged-in');return;}
    document.body.classList.remove('logged-in');
    let timer=null;
    function tryRender(){
      att.current++;
      if(!window.google?.accounts?.id){if(att.current<60)timer=setTimeout(tryRender,300);return;}
      const el=document.getElementById('googleSignInDiv');
      if(!el){if(att.current<60)timer=setTimeout(tryRender,300);return;}
      try{
        window.google.accounts.id.initialize({client_id:CONFIG.GOOGLE_CLIENT_ID,callback:r=>{
          try{
            const p=decodeJwt(r.credential);const email=p.email||'';const name=p.name||email;
            if(!CONFIG.ALLOWED_EMAIL_DOMAIN||email.endsWith(CONFIG.ALLOWED_EMAIL_DOMAIN)){
              setUserName(name);localStorage.setItem(CONFIG.STORAGE.username,name);registerUserOnLogin(name);
            }else alert(`請使用學校電郵 (${CONFIG.ALLOWED_EMAIL_DOMAIN}) 登入`);
          }catch{alert('登入失敗，請重試');}
        }});
        window.google.accounts.id.renderButton(el,{theme:'outline',size:'large',width:300});
      }catch{}
    }
    timer=setTimeout(tryRender,300);
    return ()=>{if(timer)clearTimeout(timer);};
  },[userName,setUserName,enabled]);
}

function normalizeLesson(l){
  const o={...l};
  o.estimatedMin=Number(o.estimatedMin||0);
  if(typeof o.questions==='string'){try{o.questions=JSON.parse(o.questions)||[];}catch{o.questions=[];}}
  if(!Array.isArray(o.questions))o.questions=[];
  o.questions=o.questions.map((q,i)=>({
    id:q.id||`q${i+1}`,type:q.type==='fill'?'fill':'mcq',text:q.text||'',
    options:Array.isArray(q.options)?q.options:(typeof q.options==='string'?String(q.options).split('|'):[]),
    answer:q.answer==null?'':String(q.answer)}));
  o.topic=o.topic||'未分類';o.dueDate=o.dueDate?String(o.dueDate).slice(0,10):'';
  o.targetForm=o.targetForm||'All';
  return o;
}
function useLessons(){
  const KEY=CONFIG.STORAGE.lessons, STALE=3*60*1000;
  const readCache=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch{return null;}};
  const boot=readCache();
  const [lessons,setLessons]=useState((boot?.data||[]).map(normalizeLesson));
  const [loading,setLoading]=useState(!boot?.data?.length);
  const [syncing,setSyncing]=useState(false);
  const [error,setError]=useState(null);
  const fetchLessons=useCallback(async(silent=false)=>{
    if(!silent)setLoading(true);else setSyncing(true);
    setError(null);
    if(!isScriptConfigured()){setLessons(DUMMY_LESSONS.map(normalizeLesson));setLoading(false);setSyncing(false);return;}
    try{
      const res=await fetch(`${CONFIG.GOOGLE_SCRIPT_URL}?action=getLessons&t=${Date.now()}`);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      const arr=Array.isArray(data.lessons)?data.lessons.map(normalizeLesson):[];
      const result=arr.length?arr:DUMMY_LESSONS.map(normalizeLesson);
      setLessons(result);
      try{localStorage.setItem(KEY,JSON.stringify({data:result,ts:Date.now()}));}catch{}
    }catch(e){
      if(!readCache()?.data?.length)setLessons(DUMMY_LESSONS.map(normalizeLesson));
      setError(`⚠️ 無法連接 Google Sheet，顯示示範／快取數據。(${e.message})`);
    }finally{setLoading(false);setSyncing(false);}
  },[]);
  useEffect(()=>{
    const c=readCache();
    if(!c?.data?.length){fetchLessons(false);return;}
    if(Date.now()-(c.ts||0)>STALE)fetchLessons(true);
  },[fetchLessons]);
  return {lessons,loading,syncing,error,refetchLessons:()=>fetchLessons(false)};
}

/* ===================== Hooks：進度 ===================== */
function useProgressData(userName){
  const [allProgress,setAllProgress]=useState(null);
  const [loading,setLoading]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [error,setError]=useState(null);
  const [lastSync,setLastSync]=useState(null);

  const fetchProgress=useCallback(async(silent=false)=>{
    if(!userName||userName==='訪客 (未登入)')return;
    setError(null);
    const local=LocalProgress.nested();
    const hasLocal=Object.keys(local).length>0;
    if(hasLocal&&!silent){setAllProgress(prev=>prev||local);setLoading(false);}
    else if(!silent&&!hasLocal)setLoading(true);
    if(!isScriptConfigured()){
      setAllProgress(hasLocal?local:DUMMY_PROGRESS);setLoading(false);setLastSync(new Date().toISOString());return;}
    setSyncing(true);
    try{
      const res=await fetch(`${CONFIG.GOOGLE_SCRIPT_URL}?action=getProgress&t=${Date.now()}`);
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      const remote={};
      Object.entries(data.progress||{}).forEach(([lid,m])=>{
        remote[lid]={};Object.entries(m||{}).forEach(([n,r])=>{remote[lid][n]=normalizeRecord(r);});
      });
      const merged={};
      const lids=new Set([...Object.keys(remote),...Object.keys(local)]);
      lids.forEach(lid=>{
        merged[lid]={};
        const names=new Set([...Object.keys(remote[lid]||{}),...Object.keys(local[lid]||{})]);
        names.forEach(n=>{merged[lid][n]=mergeRecords(remote[lid]?.[n],local[lid]?.[n]);});
      });
      setAllProgress(Object.keys(merged).length?merged:(hasLocal?local:DUMMY_PROGRESS));
      setLastSync(new Date().toISOString());
    }catch(e){
      setError(e.message);
      if(!hasLocal)setAllProgress(DUMMY_PROGRESS);else setAllProgress(local);
    }finally{setSyncing(false);setLoading(false);}
  },[userName]);

  const submitProgress=useCallback((lessonId,rec,opts={})=>{
    const {isAssignment=true,immediate=false}=opts;
    if(!userName||userName==='訪客 (未登入)'||!isAssignment)return;
    const full={...rec,lessonId,student:userName,form:parseUserForm(userName)||'',
      appVersion:APP_VERSION,device:(navigator.userAgent||'').slice(0,120),updatedAt:new Date().toISOString()};
    LocalProgress.set(lessonId,userName,full);
    setAllProgress(prev=>{
      const next={...(prev||{})};
      next[lessonId]={...(next[lessonId]||{}),[userName]:normalizeRecord(full)};
      return next;
    });
    SaveQueue.push(`${lessonId}::${userName}`,full,immediate);
  },[userName]);

  const getProgress=useCallback((lessonId,name=userName)=>{
    const r=allProgress?.[lessonId]?.[name];
    if(r)return r;
    return normalizeRecord(LocalProgress.get(lessonId,name||userName));
  },[allProgress,userName]);

  useEffect(()=>{fetchProgress(false);},[fetchProgress]);
  return {allProgress,loading,syncing,error,lastSync,submitProgress,getProgress,refetch:()=>fetchProgress(true)};
}

/* ===================== 教師分析核心 ===================== */
function useAnalytics(lessons,allProgress,registeredUsers,userMap){
  return useMemo(()=>{
    const assigned=lessons.filter(isAssignedLesson);
    const nameSet=new Set();
    Object.values(allProgress||{}).forEach(m=>Object.keys(m||{}).forEach(n=>nameSet.add(n)));
    (registeredUsers||[]).forEach(n=>nameSet.add(n));
    const roster=[...nameSet]
      .filter(n=>n&&n!=='訪客 (未登入)'&&!isTeacher(n))
      .map(n=>({name:n,...parseUsername(n),lastLoginAt:userMap?.[n]?.lastLoginAt||''}))
      .sort(sortStudentCmp);
    const forms=[...new Set(roster.map(s=>s.form).filter(Boolean))].sort();

    const lessonStats=assigned.map(lesson=>{
      const map=allProgress?.[lesson.id]||{};
      const expected=roster.filter(s=>matchesTargetForm(lesson.targetForm,s.form));
      const rows=expected.map(s=>({student:s,p:map[s.name]||null}));
      Object.keys(map).forEach(n=>{
        if(!expected.some(e=>e.name===n))rows.push({student:{name:n,...parseUsername(n)},p:map[n]});
      });
      const started=rows.filter(r=>(r.p?.watchPct||0)>0).length;
      const completed=rows.filter(r=>r.p?.completedAt).length;
      const notStarted=rows.filter(r=>!((r.p?.watchPct||0)>0)).map(r=>r.student.name);
      const withData=rows.filter(r=>r.p);
      const avgWatch=avgOf(rows.map(r=>r.p?.watchPct||0));
      const totalMin=sumOf(rows.map(r=>r.p?.totalWatchSec||0))/60;
      const scores=withData.map(r=>r.p.score).filter(v=>v!=null&&isFinite(v));
      const flagged=rows.filter(r=>r.p&&computeFlags(lesson,r.p).length>0).length;
      const completionRate=rows.length?Math.round(completed/rows.length*100):0;
      const lastActive=rows.map(r=>r.p?.lastViewAt||r.p?.completedAt||'').filter(Boolean).sort().pop()||'';
      return {lesson,rows,expectedCount:rows.length,started,completed,notStarted,avgWatch,
        totalMin,avgScore:scores.length?Math.round(avgOf(scores)):null,flagged,completionRate,
        progressMap:map,classmates:expected.map(e=>e.name),lastActive};
    }).sort((a,b)=>String(b.lesson.dueDate||'').localeCompare(String(a.lesson.dueDate||'')));

    const studentStats=roster.map(s=>{
      const mine=assigned.filter(l=>matchesTargetForm(l.targetForm,s.form));
      const items=mine.map(l=>({lesson:l,p:allProgress?.[l.id]?.[s.name]||null}));
      const completed=items.filter(i=>i.p?.completedAt).length;
      const started=items.filter(i=>(i.p?.watchPct||0)>0).length;
      const overdue=items.filter(i=>!i.p?.completedAt&&i.lesson.dueDate&&isOverdue(i.lesson.dueDate)).length;
      const avgWatch=items.length?avgOf(items.map(i=>i.p?.watchPct||0)):0;
      const totalMin=sumOf(items.map(i=>i.p?.totalWatchSec||0))/60;
      const scores=items.map(i=>i.p?.score).filter(v=>v!=null&&isFinite(v));
      const lastActive=items.map(i=>i.p?.lastViewAt||i.p?.completedAt||'').filter(Boolean).sort().pop()||s.lastLoginAt||'';
      const flags=items.reduce((a,i)=>a+computeFlags(i.lesson,i.p).length,0);
      return {...s,items,total:items.length,completed,started,overdue,avgWatch,totalMin,
        avgScore:scores.length?Math.round(avgOf(scores)):null,lastActive,flags,
        completionRate:items.length?Math.round(completed/items.length*100):0};
    });

    const formStats=forms.map(f=>{
      const ss=studentStats.filter(s=>s.form===f);
      return {form:f,count:ss.length,completionRate:ss.length?Math.round(avgOf(ss.map(s=>s.completionRate))):0,
        avgWatch:ss.length?Math.round(avgOf(ss.map(s=>s.avgWatch))):0,
        overdue:sumOf(ss.map(s=>s.overdue))};
    });

    const totalExpected=sumOf(lessonStats.map(s=>s.expectedCount));
    const totalCompleted=sumOf(lessonStats.map(s=>s.completed));
    const totalStarted=sumOf(lessonStats.map(s=>s.started));
    const totalMinutes=sumOf(lessonStats.map(s=>s.totalMin));
    const todayStr=getHKDateString();
    const activeToday=new Set();
    Object.values(allProgress||{}).forEach(m=>Object.entries(m||{}).forEach(([n,p])=>{
      const t=p?.lastViewAt||p?.completedAt||'';
      if(t&&getHKDateString(new Date(t))===todayStr)activeToday.add(n);
    }));
    const recent=[];
    Object.entries(allProgress||{}).forEach(([lid,m])=>{
      const lesson=lessons.find(l=>l.id===lid);if(!lesson)return;
      Object.entries(m||{}).forEach(([n,p])=>{
        const t=p?.lastViewAt||p?.completedAt||p?.startedAt||'';
        if(t)recent.push({name:n,lesson,p,time:t});
      });
    });
    recent.sort((a,b)=>String(b.time).localeCompare(String(a.time)));

    const followUp=[];
    lessonStats.forEach(s=>{
      if(!s.lesson.dueDate)return;
      const d=daysUntilDue(s.lesson.dueDate);
      if(d===null||d>2)return;
      s.rows.filter(r=>!r.p?.completedAt).forEach(r=>{
        followUp.push({lesson:s.lesson,student:r.student,p:r.p,overdue:isOverdue(s.lesson.dueDate),days:d});
      });
    });
    followUp.sort((a,b)=>(a.days-b.days)||((a.p?.watchPct||0)-(b.p?.watchPct||0)));

    return {assigned,roster,forms,lessonStats,studentStats,formStats,recent:recent.slice(0,25),followUp,
      totals:{expected:totalExpected,completed:totalCompleted,started:totalStarted,
        completionRate:totalExpected?Math.round(totalCompleted/totalExpected*100):0,
        avgWatch:lessonStats.length?Math.round(avgOf(lessonStats.map(s=>s.avgWatch))):0,
        minutes:Math.round(totalMinutes),students:roster.length,activeToday:activeToday.size,
        flagged:sumOf(lessonStats.map(s=>s.flagged))}};
  },[lessons,allProgress,registeredUsers,userMap]);
}

function buildQuestionAnalytics(lesson,rows){
  const qs=lesson.questions||[];
  return qs.map((q,i)=>{
    let answered=0,correct=0;const dist={};
    rows.forEach(({p})=>{
      const a=p?.answers?.[q.id];
      if(a===undefined||a===null||a==='')return;
      answered++;
      const key=q.type==='mcq'?String(a):String(a).trim();
      dist[key]=(dist[key]||0)+1;
      if(isAnswerCorrect(q,a))correct++;
    });
    return {q,index:i,answered,correct,rate:answered?Math.round(correct/answered*100):null,dist};
  });
}

function StudentStatsView({lessons,getProgress}){
  const stats=useMemo(()=>lessons.map(l=>{
    const p=getProgress(l.id);
    return {lesson:l,p,watchPct:p?.watchPct||0,answered:p?.answers?Object.keys(p.answers).length:0,
      totalQ:l.questions?.length||0,completedAt:p?.completedAt||null};
  }),[lessons,getProgress]);
  if(!stats.length)return <EmptyState icon="📚" title="尚無派發任務" subtitle="老師派發任務後，這裡會顯示你的追蹤數據"/>;
  const completed=stats.filter(s=>s.completedAt).length;
  const inProg=stats.filter(s=>!s.completedAt&&s.watchPct>0).length;
  const avgWatch=Math.round(avgOf(stats.map(s=>s.watchPct)));
  const minutes=Math.round(sumOf(stats.map(s=>s.p?.totalWatchSec||0))/60);
  const scores=stats.map(s=>s.p?.score).filter(v=>v!=null);
  return (<div className="space-y-4">
    <div className="grid grid-cols-2 gap-2">
      <div className="bg-gradient-to-br from-green-500 to-emerald-500 text-white p-4 rounded-2xl">
        <div className="text-3xl mb-1">✅</div><div className="text-2xl font-extrabold">{completed}/{stats.length}</div>
        <div className="text-xs text-white/85">已完成任務</div></div>
      <div className="bg-gradient-to-br from-indigo-500 to-purple-500 text-white p-4 rounded-2xl">
        <div className="text-3xl mb-1">📊</div><div className="text-2xl font-extrabold">{avgWatch}%</div>
        <div className="text-xs text-white/85">平均觀看率</div></div></div>
    <div className="grid grid-cols-3 gap-2">
      <MiniStatCard icon="fa-play-circle" label="進行中" value={inProg} color="blue"/>
      <MiniStatCard icon="fa-stopwatch" label="累計時間" value={`${minutes}m`} color="amber"/>
      <MiniStatCard icon="fa-star" label="平均得分" value={scores.length?`${Math.round(avgOf(scores))}%`:'—'} color="green"/></div>
    <div><h3 className="font-bold text-gray-700 dark:text-gray-200 mb-2 text-sm"><i className="fas fa-list-check text-indigo-500 mr-2"></i>逐項進度</h3>
      <div className="space-y-2">{stats.map(s=>(
        <div key={s.lesson.id} className="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl p-3">
          <div className="flex items-center gap-3">
            <ProgressRing pct={s.watchPct} size={40} strokeWidth={4}/>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-bold text-gray-700 dark:text-gray-200 truncate">{s.lesson.title}</p>
              <div className="flex items-center gap-2 text-[10px] text-gray-400 mt-0.5 flex-wrap">
                <span>觀看 {fmtPct(s.watchPct)}</span>
                {s.totalQ>0&&<span>· 題目 {s.answered}/{s.totalQ}</span>}
                {s.p?.totalWatchSec>0&&<span>· 播放 {fmtMin(s.p.totalWatchSec)}</span>}
                {s.p?.lastViewAt&&<span>· {fmtRel(s.p.lastViewAt)}</span>}</div></div>
            <StatusBadge status={computeStatus(s.lesson,s.p)} compact/></div>
          {s.p?.segments&&s.p?.durationSec>0&&<div className="mt-2"><CoverageBar segments={s.p.segments} duration={s.p.durationSec} height={6}/></div>}
        </div>))}
      </div></div>
  </div>);
}

/* ===================== 播放器（追蹤核心） ===================== */
function LessonPlayerScreen({lesson,userName,initialProgress,onSaveProgress,onBack,isAssignment,previewMode}){
  const toast=useToast();
  const P=initialProgress||{};
  const [watchPct,setWatchPct]=useState(P.watchPct||0);
  const [duration,setDuration]=useState(P.durationSec||0);
  const [answers,setAnswers]=useState(P.answers||{});
  const [completedAt,setCompletedAt]=useState(P.completedAt||'');
  const [videoReady,setVideoReady]=useState(false);
  const [isPlaying,setIsPlaying]=useState(false);
  const [submitLoading,setSubmitLoading]=useState(false);
  const [resumeAt,setResumeAt]=useState(0);
  const [saveState,setSaveState]=useState('idle'); // idle|saving|saved

  const playerRef=useRef(null),containerRef=useRef(null),tickRef=useRef(null),autoSaveRef=useRef(null);
  const answersRef=useRef(answers),completedRef=useRef(completedAt),pctRef=useRef(P.watchPct||0),ignoreSeek=useRef(false);
  useEffect(()=>{answersRef.current=answers;},[answers]);
  useEffect(()=>{completedRef.current=completedAt;},[completedAt]);

  const statsRef=useRef(null);
  if(!statsRef.current){
    const watched=new Set();
    parseRanges(P.segments).forEach(([a,b])=>{for(let s=a;s<=b;s++)watched.add(s);});
    statsRef.current={
      watched,heat:Array.isArray(P.heat)&&P.heat.length?P.heat.slice(0,HEAT_BUCKETS):new Array(HEAT_BUCKETS).fill(0),
      totalWatchSec:P.totalWatchSec||0,sessions:P.sessions||0,seekCount:P.seekCount||0,
      maxRate:P.maxRate||1,focusLoss:P.focusLoss||0,lastPosition:P.lastPosition||0,
      duration:P.durationSec||0,basePct:P.watchPct||0,startedAt:P.startedAt||'',tickPos:null,dirty:false};
  }
  const hasVideo=lesson.videoId&&!['PLACEHOLDER_VIDEO_ID','YOUTUBE_VIDEO_ID_HERE'].includes(lesson.videoId)&&String(lesson.videoId).trim()!=='';
  const totalQ=lesson.questions?.length||0;
  const answered=Object.keys(answers).filter(k=>answers[k]!==''&&answers[k]!=null).length;
  const questionsUnlocked=!isAssignment||watchPct>=CONFIG.VIDEO_UNLOCK_THRESHOLD;
  const allAnswered=totalQ===0?watchPct>=CONFIG.VIDEO_COMPLETE_THRESHOLD:answered>=totalQ;

  const currentPct=useCallback(()=>{
    const st=statsRef.current;
    const p=st.duration>0?Math.min(100,(st.watched.size/st.duration)*100):0;
    return Math.max(p,st.basePct||0);
  },[]);

  const persist=useCallback((opts={})=>{
    if(!isAssignment)return;
    const st=statsRef.current;
    const correct=countCorrect(lesson,answersRef.current);
    const rec={
      watchPct:Math.round(currentPct()*10)/10,
      watchedSec:st.watched.size,durationSec:st.duration,totalWatchSec:Math.round(st.totalWatchSec),
      sessions:st.sessions,seekCount:st.seekCount,maxRate:Math.round(st.maxRate*100)/100,
      focusLoss:st.focusLoss,lastPosition:st.lastPosition,
      segments:rangesToStr(secsToRanges(st.watched)),heat:st.heat,
      answers:answersRef.current,correct,totalQ,
      score:totalQ>0?Math.round(correct/totalQ*100):null,
      startedAt:st.startedAt||new Date().toISOString(),
      lastViewAt:new Date().toISOString(),completedAt:completedRef.current||''};
    if(!st.startedAt)st.startedAt=rec.startedAt;
    rec.status=computeStatus(lesson,rec);
    st.dirty=false;
    setSaveState('saving');
    onSaveProgress(lesson.id,rec,{isAssignment:true,immediate:!!opts.immediate});
    setTimeout(()=>setSaveState('saved'),600);
  },[isAssignment,lesson,totalQ,onSaveProgress,currentPct]);

  const mark=useCallback(s=>{
    const st=statsRef.current;if(s<0)return;
    if(st.watched.has(s)){
      if(st.duration>0){const b=Math.min(HEAT_BUCKETS-1,Math.floor((s/st.duration)*HEAT_BUCKETS));st.heat[b]=(st.heat[b]||0)+1;}
    }else st.watched.add(s);
  },[]);

  const tick=useCallback(()=>{
    const pl=playerRef.current;if(!pl||!pl.getCurrentTime)return;
    const st=statsRef.current;
    const cur=Math.floor(pl.getCurrentTime()||0);
    const dur=Math.floor(pl.getDuration()||0);
    if(dur>0&&dur!==st.duration){st.duration=dur;setDuration(dur);}
    const rate=pl.getPlaybackRate?pl.getPlaybackRate():1;
    if(rate>st.maxRate)st.maxRate=rate;
    const prev=st.tickPos;
    if(prev===null||prev===undefined){mark(cur);st.totalWatchSec+=1;}
    else{
      const gap=cur-prev;
      if(gap>0&&gap<=CONFIG.GAP_FILL_MAX){for(let s=prev;s<=cur;s++)mark(s);st.totalWatchSec+=1;}
      else if(gap===0){mark(cur);st.totalWatchSec+=1;}
      else{
        if(ignoreSeek.current)ignoreSeek.current=false;else st.seekCount+=1;
        mark(cur);st.totalWatchSec+=1;}
    }
    st.tickPos=cur;st.lastPosition=cur;st.dirty=true;
    const eff=currentPct();
    if(eff>pctRef.current+0.05){pctRef.current=eff;setWatchPct(eff);}
  },[mark,currentPct]);

  const startTick=useCallback(()=>{
    if(tickRef.current)clearInterval(tickRef.current);
    tickRef.current=setInterval(tick,CONFIG.TICK_MS);
  },[tick]);
  const stopTick=useCallback(()=>{
    if(tickRef.current){clearInterval(tickRef.current);tickRef.current=null;}
    statsRef.current.tickPos=null;
  },[]);

  /* 播放器初始化 */
  useEffect(()=>{
    if(!hasVideo)return;
    let mounted=true;
    loadYouTubeAPI().then(YT=>{
      if(!mounted)return;
      playerRef.current=new YT.Player(containerRef.current,{
        videoId:lesson.videoId,
        playerVars:{rel:0,modestbranding:1,cc_load_policy:0,hl:'zh-TW',playsinline:1},
        events:{
          onReady:()=>{
            if(!mounted)return;
            setVideoReady(true);
            const dur=Math.floor(playerRef.current?.getDuration?.()||0);
            if(dur>0){statsRef.current.duration=dur;setDuration(dur);
              pctRef.current=currentPct();setWatchPct(pctRef.current);}
            const lp=statsRef.current.lastPosition||0;
            if(lp>15&&(!dur||lp<dur-10)){
              ignoreSeek.current=true;
              try{playerRef.current.seekTo(lp,true);}catch{}
              setResumeAt(lp);
            }
          },
          onStateChange:e=>{
            if(!mounted)return;
            if(e.data===1){setIsPlaying(true);statsRef.current.sessions+=1;startTick();}
            else{
              setIsPlaying(false);stopTick();
              if(e.data===2||e.data===0)persist({immediate:e.data===0});
            }
          }
        }
      });
    });
    return ()=>{
      mounted=false;stopTick();
      if(isAssignment){persist({immediate:true});SaveQueue.flush(true);}
      if(playerRef.current?.destroy){try{playerRef.current.destroy();}catch{}}
    };
  },[lesson.videoId]);

  /* 定期自動儲存 */
  useEffect(()=>{
    if(!isAssignment)return;
    autoSaveRef.current=setInterval(()=>{if(statsRef.current.dirty)persist();},CONFIG.SAVE_THROTTLE_MS);
    return ()=>{if(autoSaveRef.current)clearInterval(autoSaveRef.current);};
  },[isAssignment,persist]);

  /* 答題變化 → 立即儲存 */
  useEffect(()=>{if(isAssignment&&Object.keys(answers).length)persist();},[answers]);

  /* 離開畫面 → 暫停 + 記錄 */
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden&&playerRef.current?.getPlayerState){
        if(playerRef.current.getPlayerState()===1){
          playerRef.current.pauseVideo();
          statsRef.current.focusLoss+=1;
          if(isAssignment){persist({immediate:true});toast('影片已暫停！請保持在此畫面上課 👀','warning',4000);}
        }
      }
    };
    document.addEventListener('visibilitychange',onVis);
    return ()=>document.removeEventListener('visibilitychange',onVis);
  },[isAssignment,persist,toast]);

  /* 無題目影片：達門檻自動完成 */
  useEffect(()=>{
    if(!isAssignment||completedAt||totalQ>0)return;
    if(watchPct>=CONFIG.VIDEO_COMPLETE_THRESHOLD){
      const now=new Date().toISOString();
      completedRef.current=now;setCompletedAt(now);
      persist({immediate:true});
      toast('🎉 已看完影片，任務自動標記完成！','success',4000);
    }
  },[watchPct,isAssignment,completedAt,totalQ]);

  async function handleSubmit(){
    if(!isAssignment)return;
    if(!questionsUnlocked)return toast(`請先觀看影片至 ${CONFIG.VIDEO_UNLOCK_THRESHOLD}%`,'warning');
    if(!allAnswered)return toast('請先回答所有題目','warning');
    setSubmitLoading(true);
    const now=new Date().toISOString();
    completedRef.current=now;setCompletedAt(now);
    persist({immediate:true});
    setTimeout(()=>{setSubmitLoading(false);toast('🎉 課題完成！進度已儲存','success',4000);},400);
  }

  const remain=Math.max(0,CONFIG.VIDEO_UNLOCK_THRESHOLD-Math.round(watchPct));
  const st=statsRef.current;

  return (<div className="w-full max-w-2xl landscape:max-w-5xl"><div className="glass-panel rounded-3xl shadow-xl overflow-hidden">
    <div className="flex items-center gap-3 p-4 border-b border-gray-100 dark:border-gray-700 bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-900/30 dark:to-purple-900/30">
      <button onClick={()=>{if(isAssignment){persist({immediate:true});SaveQueue.flush();}onBack();}}
        className="w-9 h-9 rounded-full bg-white dark:bg-gray-700 shadow flex items-center justify-center text-gray-600 dark:text-gray-300 flex-shrink-0">
        <i className="fas fa-arrow-left"></i></button>
      <div className="flex-1 min-w-0">
        <span className="text-xs text-indigo-500 dark:text-indigo-400 font-bold">{lesson.topic}</span>
        <h2 className="font-bold text-gray-800 dark:text-gray-100 truncate text-sm md:text-base">{lesson.title}</h2></div>
      {completedAt&&isAssignment&&<span className="flex-shrink-0 text-xs bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300 px-2 py-1 rounded-full font-bold">
        <i className="fas fa-check-circle mr-1"></i>已完成</span>}
      {!isAssignment&&<span className="flex-shrink-0 text-xs bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300 px-2 py-1 rounded-full font-bold">
        <i className="fas fa-eye mr-1"></i>{previewMode?'預覽':'自由觀看'}</span>}
    </div>

    <div className="overflow-y-auto custom-scrollbar max-h-[calc(92vh-64px)] p-4 md:p-6">
      {!isAssignment&&(
        <div className="mb-3 p-3 bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-900/20 dark:to-orange-900/20 border border-amber-200 dark:border-amber-800 rounded-xl flex items-start gap-2.5">
          <i className="fas fa-info-circle text-amber-500 mt-0.5"></i>
          <div className="flex-1 text-xs">
            <p className="font-bold text-amber-700 dark:text-amber-300">{previewMode?'教師預覽模式':'自由觀看模式'}</p>
            <p className="text-amber-600 dark:text-amber-400 mt-0.5">
              {previewMode?'不會寫入該學生的任何進度資料。':'此影片並非派發任務，觀看進度與答題不會被記錄。'}</p></div></div>)}

      {resumeAt>0&&(
        <div className="mb-3 p-2.5 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800 rounded-xl flex items-center gap-2 text-xs">
          <i className="fas fa-bookmark text-indigo-500"></i>
          <span className="flex-1 text-indigo-700 dark:text-indigo-300">已跳至上次觀看位置 <b>{fmtDur(resumeAt)}</b></span>
          <button onClick={()=>{ignoreSeek.current=true;try{playerRef.current.seekTo(0,true);}catch{}setResumeAt(0);}}
            className="font-bold text-indigo-500">從頭開始</button></div>)}

      <div className="mb-4">
        <div className="relative rounded-2xl overflow-hidden shadow-lg bg-black aspect-video">
          {hasVideo?<div ref={containerRef} className="w-full h-full"/>:(
            <div className="video-placeholder absolute inset-0 flex items-center justify-center">
              <div className="bg-white dark:bg-gray-800 rounded-xl p-5 shadow-lg text-center border-2 border-dashed border-gray-300 dark:border-gray-600">
                <i className="fab fa-youtube text-5xl text-red-500 mb-3"></i>
                <p className="font-bold text-gray-700 dark:text-gray-200 text-sm">影片尚未設定</p></div></div>)}
        </div>

        {isAssignment&&(
          <div className="mt-3 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl p-3">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-xs font-bold text-gray-600 dark:text-gray-300"><i className="fas fa-eye text-indigo-500 mr-1.5"></i>影片觀看進度</span>
              <span className={`text-sm font-extrabold ${watchPctColor(watchPct)}`}>{fmtPct(watchPct)}</span></div>
            <div className="h-2 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
              <div className={`h-full rounded-full bg-gradient-to-r ${watchPctGradient(watchPct)}`} style={{width:fmtPct(watchPct)}}/></div>
            <div className="mt-2 grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] text-gray-400">
              <span><i className="fas fa-stopwatch mr-1"></i>播放 {fmtMin(st.totalWatchSec)}</span>
              <span><i className="fas fa-film mr-1"></i>片長 {duration?fmtDur(duration):'—'}</span>
              <span><i className="fas fa-repeat mr-1"></i>{st.sessions} 次播放</span>
              <span className={saveState==='saved'?'text-green-500':''}>
                <i className={`fas ${saveState==='saving'?'fa-spinner fa-spin':'fa-cloud'} mr-1`}></i>
                {saveState==='saving'?'儲存中':saveState==='saved'?'已儲存':'自動儲存'}</span></div>
            {!questionsUnlocked&&<div className="mt-2 text-xs text-amber-600 dark:text-amber-400">
              <i className="fas fa-lock mr-1.5"></i>觀看至 <strong>{CONFIG.VIDEO_UNLOCK_THRESHOLD}%</strong> 解鎖題目（差 {remain}%）</div>}
            {questionsUnlocked&&!completedAt&&totalQ>0&&<div className="mt-2 text-xs text-green-600 dark:text-green-400">
              <i className="fas fa-unlock mr-1.5"></i>已解鎖題目！請完成下方問題</div>}
          </div>)}
      </div>

      {isAssignment&&(<div className="relative">
        {!questionsUnlocked&&(
          <div className="question-lock-overlay absolute inset-0 z-10 rounded-2xl bg-white/70 dark:bg-gray-900/70 flex flex-col items-center justify-center gap-3">
            <i className="fas fa-lock text-4xl text-gray-400"></i>
            <p className="text-sm font-bold text-gray-500 dark:text-gray-400">觀看影片達 {CONFIG.VIDEO_UNLOCK_THRESHOLD}% 後解鎖題目</p></div>)}
        {totalQ===0?(
          <div className="py-8 text-center text-gray-400 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-2xl">
            <i className="fas fa-video text-3xl mb-2 opacity-40"></i>
            <p className="text-sm font-bold">本課題無問答題目</p>
            <p className="text-xs mt-1">觀看達 {CONFIG.VIDEO_COMPLETE_THRESHOLD}% 會自動標記完成</p>
            {!completedAt&&allAnswered&&<button onClick={handleSubmit} disabled={submitLoading}
              className="mt-3 px-6 py-2 bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-xl font-bold text-sm">
              <i className="fas fa-paper-plane mr-1"></i>標記為已完成</button>}
          </div>
        ):(<div className="space-y-3">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-gray-700 dark:text-gray-200 text-sm"><i className="fas fa-clipboard-question text-indigo-500 mr-2"></i>課題問題</h3>
            <span className="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 px-2 py-0.5 rounded-full font-bold">{answered} / {totalQ}</span></div>
          {lesson.questions.map((q,i)=>(
            <QuestionItem key={q.id} question={q} index={i} answer={answers[q.id]}
              onAnswer={v=>setAnswers(p=>({...p,[q.id]:v}))} disabled={!!completedAt}/>))}
          {!completedAt&&<button onClick={handleSubmit} disabled={!allAnswered||submitLoading}
            className={`w-full py-3 px-6 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2 mt-2 ${allAnswered?'bg-gradient-to-r from-green-500 to-emerald-500 text-white':'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'}`}>
            {submitLoading?<><i className="fas fa-spinner fa-spin"></i>儲存中...</>:allAnswered?<><i className="fas fa-paper-plane"></i>提交答案</>:<><i className="fas fa-pen"></i>請完成所有題目（{answered}/{totalQ}）</>}</button>}
          {completedAt&&<div className="p-4 bg-gradient-to-br from-green-50 to-emerald-50 dark:from-green-900/30 dark:to-emerald-900/30 border border-green-200 dark:border-green-700 rounded-2xl text-center">
            <i className="fas fa-trophy text-3xl text-yellow-500 mb-2"></i>
            <p className="font-bold text-green-700 dark:text-green-300">課題已完成！</p>
            <p className="text-xs text-green-600 dark:text-green-400 mt-1">完成時間：{fmtDT(completedAt)}
              {totalQ>0&&` · 得分 ${Math.round(countCorrect(lesson,answers)/totalQ*100)}%`}</p></div>}
        </div>)}
      </div>)}
    </div></div></div>);
}

function QuestionItem({question,index,answer,onAnswer,disabled}){
  return (<div className="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl p-4 shadow-sm">
    <p className="text-sm font-bold text-gray-700 dark:text-gray-200 mb-3 flex items-start gap-2">
      <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 text-white text-xs flex-shrink-0">{index+1}</span>
      <span>{question.text}</span></p>
    {question.type==='mcq'&&Array.isArray(question.options)&&(
      <div className="grid grid-cols-1 gap-2">{question.options.map((opt,oi)=>{
        const sel=answer===String(oi);
        const ok=disabled&&String(oi)===String(question.answer);
        const bad=disabled&&sel&&String(oi)!==String(question.answer);
        return (<button key={oi} onClick={()=>!disabled&&onAnswer(String(oi))}
          className={`text-left px-4 py-2.5 rounded-xl border-2 text-sm font-medium transition-all ${
            disabled?(ok?'border-green-400 bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300':
              bad?'border-red-400 bg-red-50 dark:bg-red-900/30 text-red-600':'border-gray-200 dark:border-gray-600 text-gray-500 opacity-60'):
            sel?'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 shadow':
              'border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200'}`}>
          <span className="font-bold mr-2">{['A','B','C','D','E'][oi]}.</span>{opt}
          {disabled&&ok&&<i className="fas fa-check ml-2 text-green-500"></i>}
          {disabled&&bad&&<i className="fas fa-times ml-2 text-red-500"></i>}</button>);})}
      </div>)}
    {question.type==='fill'&&(<div>
      <input type="text" value={answer||''} onChange={e=>!disabled&&onAnswer(e.target.value)} disabled={disabled}
        placeholder="請在此輸入答案..."
        className={`w-full px-4 py-2.5 border-2 rounded-xl text-sm ${disabled?'border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-600':'border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200'}`}/>
      {disabled&&question.answer&&<div className="mt-1.5 text-xs text-green-600 dark:text-green-400">
        <i className="fas fa-check-circle mr-1"></i>參考答案：{question.answer}</div>}</div>)}
  </div>);
}

/* ===================== 教師：儀表板 ===================== */
function TeacherDashboardScreen({analytics,lessons,allProgress,onBack,onViewLessonReport,onViewStudent,onRefresh,loading,lastSync,initialTab}){
  const [tab,setTab]=useState(initialTab||'overview');
  const toast=useToast();
  const TABS=[
    {id:'overview',label:'總覽',icon:'fa-gauge-high'},
    {id:'lessons',label:'任務',icon:'fa-list-check'},
    {id:'students',label:'學生',icon:'fa-users'},
    {id:'matrix',label:'進度表',icon:'fa-table-cells'},
  ];
  function exportAll(){
    const headers=['班別','姓名','課題','標題','截止日','狀態','觀看%','已看秒','片長秒','總播放分鐘','播放次數','拖動次數','最高倍速','離開次數','答對','題數','得分%','開始時間','最後觀看','完成時間','逾期完成','異常'];
    const rows=[headers];
    analytics.lessonStats.forEach(s=>{
      s.rows.forEach(({student,p})=>{
        const flags=computeFlags(s.lesson,p).map(f=>f.label).join('/');
        rows.push([student.form||'',shortenName(student.name),s.lesson.topic,s.lesson.title,s.lesson.dueDate||'',
          {not_started:'未開始',watching:'觀看中',watched:'看完待答',answering:'作答中',completed:'已完成'}[computeStatus(s.lesson,p)],
          Math.round(p?.watchPct||0),p?.watchedSec||0,p?.durationSec||0,Math.round((p?.totalWatchSec||0)/60*10)/10,
          p?.sessions||0,p?.seekCount||0,p?.maxRate||1,p?.focusLoss||0,p?.correct||0,s.lesson.questions?.length||0,
          p?.score==null?'':p.score,p?.startedAt?fmtDT(p.startedAt):'',p?.lastViewAt?fmtDT(p.lastViewAt):'',
          p?.completedAt?fmtDT(p.completedAt):'',
          (p?.completedAt&&s.lesson.dueDate&&String(p.completedAt).slice(0,10)>s.lesson.dueDate)?'是':'',flags]);
      });
    });
    downloadCSV(`全班學習追蹤_${getHKDateString()}.csv`,rows);
    toast('已匯出全班追蹤 CSV','success');
  }
  return (<div className="w-full max-w-5xl"><div className="glass-panel rounded-3xl shadow-xl overflow-hidden flex flex-col" style={{maxHeight:'95vh'}}>
    <div className="hero-gradient p-5 text-white relative flex-shrink-0">
      <div className="flex items-center gap-3 mb-3 relative">
        <button onClick={onBack} className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center"><i className="fas fa-arrow-left"></i></button>
        <div className="flex-1 min-w-0">
          <h2 className="font-bold text-lg"><i className="fas fa-chart-line mr-2"></i>學習追蹤儀表板</h2>
          <p className="text-xs text-white/80">{analytics.roster.length} 位學生 · {analytics.assigned.length} 個派發任務 · 同步 {fmtRel(lastSync)}</p></div>
        <button onClick={exportAll} className="h-9 px-3 rounded-full bg-white/20 text-xs font-bold flex items-center gap-1.5"><i className="fas fa-file-csv"></i>總表</button>
        <button onClick={onRefresh} className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center"><i className={`fas fa-rotate-right ${loading?'fa-spin':''}`}></i></button>
      </div>
      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 relative">
        {[['整體完成率',`${analytics.totals.completionRate}%`],['平均觀看',`${analytics.totals.avgWatch}%`],
          ['完成人次',analytics.totals.completed],['已開始人次',analytics.totals.started],
          ['總觀看',`${analytics.totals.minutes}m`],['異常標記',analytics.totals.flagged]].map(([l,v])=>(
          <div key={l} className="bg-white/15 backdrop-blur rounded-xl p-2 text-center">
            <div className="text-[10px] text-white/80">{l}</div><div className="text-lg font-extrabold">{v}</div></div>))}
      </div>
    </div>
    <div className="flex bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 flex-shrink-0">
      {TABS.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          className={`flex-1 py-2.5 text-sm font-bold flex items-center justify-center gap-1.5 relative ${tab===t.id?'text-indigo-600 dark:text-indigo-400':'text-gray-400'}`}>
          <i className={`fas ${t.icon} text-xs`}></i>{t.label}
          {tab===t.id&&<div className="absolute bottom-0 left-1/4 right-1/4 h-0.5 bg-indigo-500 rounded-t"></div>}</button>))}
    </div>
    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-5">
      {analytics.assigned.length===0?
        <EmptyState icon="📭" title="尚未派發任何任務" subtitle="返回主頁點擊「發佈／編輯任務」開始建立。"/>:
        tab==='overview'?<OverviewTab analytics={analytics} onViewLessonReport={onViewLessonReport} onViewStudent={onViewStudent}/>:

    </div>
  </div></div>);
}

function StudentsTab({analytics,onViewStudent}){

    const c={class:(a,b)=>sortStudentCmp(a,b),
      completion:(a,b)=>a.completionRate-b.completionRate,
      watch:(a,b)=>a.avgWatch-b.avgWatch,

function MatrixTab({analytics,onViewLessonReport,onViewStudent}){
  const toast=useToast();
  const [form,setForm]=useState(analytics.forms[0]||'all');
  const students=useMemo(()=>form==='all'?analytics.studentStats:analytics.studentStats.filter(s=>s.form===form),[analytics.studentStats,form]);
  const lessons=useMemo(()=>{
    if(form==='all')return analytics.assigned;
    return analytics.assigned.filter(l=>matchesTargetForm(l.targetForm,form));
  },[analytics.assigned,form]);
  function cellOf(sName,lesson){
    const p=analytics.lessonStats.find(s=>s.lesson.id===lesson.id)?.progressMap?.[sName]||null;
    return p;
  }
  function exportMatrix(){
    const rows=[['班別','姓名',...lessons.map(l=>l.title),'完成數','平均觀看%']];
    students.forEach(s=>{
      const cells=lessons.map(l=>{
        const p=cellOf(s.name,l);
        if(!p)return '未開始';
        return p.completedAt?`完成(${Math.round(p.watchPct)}%)`:`${Math.round(p.watchPct)}%`;
      });
      rows.push([s.form||'',shortenName(s.name),...cells,s.completed,Math.round(s.avgWatch)]);
    });
    downloadCSV(`進度矩陣_${form}_${getHKDateString()}.csv`,rows);
    toast('已匯出進度矩陣','success');
  }
  return (<div className="space-y-3">
    <div className="flex items-center gap-2 flex-wrap">
      <select value={form} onChange={e=>setForm(e.target.value)}
        className="px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
        <option value="all">全部學生</option>{analytics.forms.map(f=><option key={f} value={f}>{f} 班</option>)}</select>
      <button onClick={exportMatrix} className="px-3 py-2 rounded-xl bg-green-50 dark:bg-green-900/20 text-green-600 text-xs font-bold border border-green-200 dark:border-green-800">
        <i className="fas fa-file-csv mr-1"></i>匯出矩陣</button>
      <div className="ml-auto flex items-center gap-2 text-[10px] text-gray-400">
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-green-500 inline-block"></span>完成</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-amber-400 inline-block"></span>觀看中</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-400 inline-block"></span>低於30%</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-gray-200 inline-block"></span>未開始</span></div>
    </div>
    {lessons.length===0||students.length===0?<EmptyState icon="📊" title="沒有可顯示的資料"/>:(
      <div className="overflow-auto custom-scrollbar border border-gray-100 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800" style={{maxHeight:'60vh'}}>
        <table className="matrix-table w-full text-xs">
          <thead><tr>
            <th className="matrix-sticky-l matrix-sticky-t matrix-corner px-2 py-2 text-left font-bold text-gray-500 min-w-[130px]">學生</th>
            {lessons.map(l=>(
              <th key={l.id} className="matrix-sticky-t px-1 py-2 font-bold text-gray-500" style={{minWidth:'54px'}}>
                <button onClick={()=>onViewLessonReport(l)} className="block w-full truncate text-[10px] hover:text-indigo-500" title={l.title}>
                  {l.title.slice(0,6)}</button>
                {l.dueDate&&<div className={`text-[8px] font-normal ${isOverdue(l.dueDate)?'text-red-400':'text-gray-300'}`}>{l.dueDate.slice(5)}</div>}</th>))}
            <th className="matrix-sticky-t px-2 py-2 font-bold text-gray-500">完成</th>
          </tr></thead>
          <tbody>{students.map(s=>(
            <tr key={s.name}>
              <td className="matrix-sticky-l px-2 py-1.5">
                <button onClick={()=>onViewStudent(s.name)} className="text-left w-full">
                  <span className="text-[9px] text-gray-400 mr-1">{s.form}{s.number?`-${s.number}`:''}</span>
                  <span className="font-bold text-gray-700 dark:text-gray-200 truncate">{shortenName(s.name)}</span></button></td>
              {lessons.map(l=>{
                const p=cellOf(s.name,l);
                const pct=p?.watchPct||0;
                const cls=p?.completedAt?'bg-green-500 text-white':
                  pct>=CONFIG.VIDEO_COMPLETE_THRESHOLD?'bg-cyan-500 text-white':
                  pct>=30?'bg-amber-400 text-white':pct>0?'bg-red-400 text-white':'bg-gray-100 dark:bg-gray-700 text-gray-400';
                const flags=computeFlags(l,p);
                return (<td key={l.id} className="px-0.5 py-1 text-center">
                  <div className={`relative mx-auto rounded-md ${cls} font-bold text-[9px] flex items-center justify-center`} style={{width:46,height:26}}
                    title={`${shortenName(s.name)} · ${l.title}\n觀看 ${fmtPct(pct)}${p?.totalWatchSec?` · 播放 ${fmtMin(p.totalWatchSec)}`:''}${p?.completedAt?`\n完成 ${fmtDT(p.completedAt)}`:''}${flags.length?`\n⚠ ${flags.map(f=>f.label).join('、')}`:''}`}>
                    {p?.completedAt?'✓':pct>0?Math.round(pct):'–'}
                    {flags.length>0&&<span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-orange-500 border border-white"></span>}
                  </div></td>);})}
              <td className="px-2 py-1 text-center font-bold text-gray-600 dark:text-gray-300">{s.completed}/{s.total}</td>
            </tr>))}
          </tbody></table></div>)}
  </div>);
}

function TeacherStudentDetailScreen({studentName,analytics,onBack,onViewLessonReport}){
  const toast=useToast();
  const s=analytics.studentStats.find(x=>x.name===studentName);
  if(!s)return (<div className="glass-panel p-8 rounded-2xl text-center max-w-sm">
    <p className="mb-4">找不到此學生資料</p>
    <button onClick={onBack} className="bg-gray-600 text-white px-6 py-2 rounded-lg">返回</button></div>);
  function exportOne(){
    const rows=[['課題','標題','截止日','狀態','觀看%','片長','總播放分鐘','播放次數','拖動','最高倍速','離開','答對/題數','得分%','開始','最後觀看','完成','異常']];
    s.items.forEach(({lesson,p})=>{
      rows.push([lesson.topic,lesson.title,lesson.dueDate||'',
        {not_started:'未開始',watching:'觀看中',watched:'看完待答',answering:'作答中',completed:'已完成'}[computeStatus(lesson,p)],
        Math.round(p?.watchPct||0),p?.durationSec?fmtDur(p.durationSec):'',Math.round((p?.totalWatchSec||0)/60*10)/10,
        p?.sessions||0,p?.seekCount||0,p?.maxRate||1,p?.focusLoss||0,
        `${p?.correct||0}/${lesson.questions?.length||0}`,p?.score==null?'':p.score,
        p?.startedAt?fmtDT(p.startedAt):'',p?.lastViewAt?fmtDT(p.lastViewAt):'',p?.completedAt?fmtDT(p.completedAt):'',
        computeFlags(lesson,p).map(f=>f.label).join('/')]);
    });

function HeatmapView({rows}){
  const data=useMemo(()=>{
    const buckets=new Array(HEAT_BUCKETS).fill(0);
    let dur=0,has=false;
    rows.forEach(({p})=>{
      if(!p)return;
      dur=Math.max(dur,p.durationSec||0);
      (p.heat||[]).forEach((v,i)=>{if(v>0){buckets[i]=(buckets[i]||0)+v;has=true;}});
    });
    if(!has)return null;
    const max=Math.max(...buckets,1);
    return {buckets,max,dur:dur||HEAT_BUCKETS};
  },[rows]);
  if(!data)return <EmptyState icon="🔥" title="暫無重看熱點資料" subtitle="學生重複觀看某片段後，此處會顯示熱點分佈。"/>;
  const {buckets,max,dur}=data;
  const segLen=dur/HEAT_BUCKETS;
  const hot=buckets.map((v,i)=>({i,v})).filter(x=>x.v>max*0.4).sort((a,b)=>b.v-a.v).slice(0,5);
  return (<div className="space-y-4">
    <div className="p-3 bg-orange-50 dark:bg-orange-900/20 border border-orange-200 dark:border-orange-800 rounded-xl">
      <p className="text-xs font-bold text-orange-700 dark:text-orange-300 mb-1"><i className="fas fa-fire mr-1"></i>重看熱點圖</p>
      <p className="text-[11px] text-orange-600 dark:text-orange-400">條越高＝該片段被全班重複觀看越多次，代表難點，建議實體課重點講解。</p></div>
    <div className="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 p-4">
      <div className="flex items-end gap-0.5 h-28">
        {buckets.map((v,i)=>{
          const h=(v/max)*100,isHot=v>max*0.4;
          return (<div key={i} className="flex-1 flex flex-col items-center justify-end group relative">
            <div className={`w-full rounded-t ${isHot?'bg-gradient-to-t from-red-500 to-orange-400':'bg-gradient-to-t from-indigo-200 to-blue-200 dark:from-indigo-800 dark:to-blue-900'}`}
              style={{height:`${Math.max(h,2)}%`}}/>
            <div className="absolute bottom-full mb-1 hidden group-hover:block bg-gray-800 text-white text-[10px] px-2 py-1 rounded whitespace-nowrap z-10">
              {fmtDur(i*segLen)}–{fmtDur((i+1)*segLen)} · {v} 次</div></div>);})}
      </div>
      <div className="flex justify-between text-[9px] text-gray-400 mt-1.5"><span>0:00</span><span>{fmtDur(dur)}</span></div></div>
    {hot.length>0&&(<div>
      <h4 className="text-xs font-bold text-gray-600 dark:text-gray-300 mb-2"><i className="fas fa-exclamation-triangle text-amber-500 mr-1"></i>建議實體課重點講解片段</h4>
      <div className="space-y-2">{hot.map((x,i)=>(
        <div key={i} className="flex items-center gap-3 bg-amber-50 dark:bg-amber-900/20 border border-amber-100 dark:border-amber-800/50 rounded-lg px-3 py-2">
          <span className="text-lg">{['🔥','🌡️','⚠️','📌','📍'][i]}</span>
          <div className="flex-1"><p className="text-xs font-bold text-gray-700 dark:text-gray-200">{fmtDur(x.i*segLen)} – {fmtDur((x.i+1)*segLen)}</p>
            <p className="text-[10px] text-amber-600">重複觀看 {x.v} 次</p></div>
          <div className="w-16 h-1.5 bg-gray-200 dark:bg-gray-600 rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-orange-400 to-red-500" style={{width:`${(x.v/max)*100}%`}}/></div></div>))}
      </div></div>)}
  </div>);
}

  const [filter,setFilter]=useState('all');
  const [expanded,setExpanded]=useState(null);

  const rows=useMemo(()=>{
    let r=[...stat.rows];
    if(filter==='completed')r=r.filter(x=>x.p?.completedAt);
    else if(filter==='watching')r=r.filter(x=>x.p&&!x.p.completedAt&&(x.p.watchPct||0)>0);
    else if(filter==='not_started')r=r.filter(x=>!((x.p?.watchPct||0)>0));
    else if(filter==='flagged')r=r.filter(x=>computeFlags(lesson,x.p).length>0);
    const c={
      watch_desc:(a,b)=>(b.p?.watchPct||0)-(a.p?.watchPct||0),
      watch_asc:(a,b)=>(a.p?.watchPct||0)-(b.p?.watchPct||0),
      class:(a,b)=>sortStudentCmp(a.student,b.student),
      time:(a,b)=>(b.p?.totalWatchSec||0)-(a.p?.totalWatchSec||0),
      score:(a,b)=>(b.p?.score||-1)-(a.p?.score||-1),
      recent:(a,b)=>String(b.p?.lastViewAt||'').localeCompare(String(a.p?.lastViewAt||''))};
    return r.sort(c[sort]||c.watch_desc);
  },[stat.rows,filter,sort,lesson]);

      '答對','題數','得分%','開始時間','最後觀看','完成時間','異常','觀看片段',...qHeaders];
    const rowsOut=[headers];
    stat.rows.forEach(({student,p})=>{
      const ans=(lesson.questions||[]).map(q=>{
        const a=p?.answers?.[q.id];

        p?.sessions||0,p?.seekCount||0,p?.maxRate||1,p?.focusLoss||0,p?.correct||0,totalQ,
        p?.score==null?'':p.score,p?.startedAt?fmtDT(p.startedAt):'',p?.lastViewAt?fmtDT(p.lastViewAt):'',
        p?.completedAt?fmtDT(p.completedAt):'',computeFlags(lesson,p).map(f=>f.label).join('/'),p?.segments||'',...ans]);

      </div>
      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 relative">
        {[['應完成',stat.expectedCount],['已開始',stat.started],['已完成',stat.completed],
          ['完成率',`${stat.completionRate}%`],['平均觀看',fmtPct(stat.avgWatch)],['總觀看',`${Math.round(stat.totalMin)}m`]].map(([l,v])=>(
          <div key={l} className="bg-white/15 rounded-xl p-2 text-center"><div className="text-[10px] text-white/80">{l}</div>
