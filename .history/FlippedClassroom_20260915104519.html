          </div>}
      </div>)}

      {tab==='questions'&&(totalQ===0?<EmptyState icon="❓" title="此課題沒有題目" subtitle="可在「發佈／編輯任務」加入題目以追蹤理解程度。"/>:(
        <div className="space-y-3">
          <div className="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-900/20 text-[11px] text-indigo-600 dark:text-indigo-300">
            <i className="fas fa-lightbulb mr-1"></i>答對率最低的題目 = 學生最弱的概念，建議課堂優先講解。</div>
          {[...qa].sort((a,b)=>(a.rate==null?101:a.rate)-(b.rate==null?101:b.rate)).map(item=>(
            <div key={item.q.id} className="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl p-3.5">
              <div className="flex items-start gap-2 mb-2">
                <span className="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 text-white text-[10px] font-bold flex items-center justify-center flex-shrink-0">Q{item.index+1}</span>
                <p className="text-sm font-bold text-gray-700 dark:text-gray-200 flex-1">{item.q.text}</p>
                <div className="text-right flex-shrink-0">
                  <div className={`text-lg font-extrabold ${item.rate==null?'text-gray-300':item.rate>=70?'text-green-500':item.rate>=40?'text-amber-500':'text-red-500'}`}>
                    {item.rate==null?'—':`${item.rate}%`}</div>
                  <div className="text-[9px] text-gray-400">答對率</div></div></div>
              <div className="h-1.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden mb-2">
                <div className={`h-full rounded-full ${item.rate>=70?'bg-green-500':item.rate>=40?'bg-amber-500':'bg-red-500'}`} style={{width:`${item.rate||0}%`}}/></div>
              <p className="text-[10px] text-gray-400 mb-2">{item.answered} 人作答 · {item.correct} 人正確</p>
              {item.q.type==='mcq'?(<div className="space-y-1">
                {item.q.options.map((opt,oi)=>{
                  const n=item.dist[String(oi)]||0;
                  const pct=item.answered?Math.round(n/item.answered*100):0;
                  const correct=String(oi)===String(item.q.answer);
                  return (<div key={oi} className="flex items-center gap-2 text-[11px]">
                    <span className={`w-5 font-bold ${correct?'text-green-600':'text-gray-400'}`}>{['A','B','C','D','E'][oi]}</span>
                    <span className={`flex-1 truncate ${correct?'font-bold text-green-700 dark:text-green-300':'text-gray-500'}`}>{opt}</span>
                    <div className="w-24 h-1.5 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden">
                      <div className={`h-full ${correct?'bg-green-500':'bg-gray-400'}`} style={{width:`${pct}%`}}/></div>
                    <span className="w-12 text-right text-gray-400">{n} 人</span></div>);})}
              </div>):(<div className="flex flex-wrap gap-1.5">
                {Object.entries(item.dist).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v])=>{
                  const ok=isAnswerCorrect(item.q,k);
                  return (<span key={k} className={`text-[10px] px-2 py-0.5 rounded font-bold ${ok?'bg-green-100 dark:bg-green-900/40 text-green-700':'bg-red-100 dark:bg-red-900/40 text-red-600'}`}>{k} ×{v}</span>);})}
                {item.q.answer&&<span className="text-[10px] text-gray-400">（標準答案：{item.q.answer}）</span>}
              </div>)}
            </div>))}
        </div>))}

      {tab==='heatmap'&&<HeatmapView rows={stat.rows}/>}
    </div>
  </div></div>);
}

/* ===================== 任務管理（含題目編輯器） ===================== */
function AssignmentAdminScreen({userName,onBack,refetchLessons,lessons=[],analytics}){
  const toast=useToast();
  const [tab,setTab]=useState('create');
  const [busy,setBusy]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [topic,setTopic]=useState('必修部分');
  const [title,setTitle]=useState('');
  const [description,setDescription]=useState('');
  const [videoId,setVideoId]=useState('');
  const [dueDate,setDueDate]=useState('');
  const [estimatedMin,setEstimatedMin]=useState(10);
  const [targetForm,setTargetForm]=useState('All');
  const [videoSel,setVideoSel]=useState('');
  const [questions,setQuestions]=useState([]);

  const uniqueVideos=useMemo(()=>{
    const seen=new Set(),out=[];
    lessons.forEach(l=>{if(l.videoId&&!seen.has(l.videoId)){seen.add(l.videoId);out.push({videoId:l.videoId,title:l.title,topic:l.topic});}});
    return out;
  },[lessons]);

  function resetForm(){
    setEditingId(null);setTitle('');setDescription('');setVideoId('');setVideoSel('');
    setDueDate('');setEstimatedMin(10);setTargetForm('All');setQuestions([]);
  }
  function loadForEdit(l){
    setEditingId(l.id);setTopic(l.topic||'必修部分');setTitle(l.title||'');setDescription(l.description||'');
    setVideoId(l.videoId||'');setDueDate(l.dueDate||'');setEstimatedMin(l.estimatedMin||10);
    setTargetForm(l.targetForm||'All');setQuestions((l.questions||[]).map(q=>({...q})));setVideoSel('custom');setTab('create');
  }
  function addQuestion(type){
    setQuestions(q=>[...q,{id:`q${Date.now().toString(36)}`,type,text:'',options:type==='mcq'?['','','',''] : [],answer:type==='mcq'?'0':''}]);
  }
  function updateQ(i,patch){setQuestions(qs=>qs.map((q,idx)=>idx===i?{...q,...patch}:q));}
  function removeQ(i){setQuestions(qs=>qs.filter((_,idx)=>idx!==i));}

  async function post(payload){
    if(!isScriptConfigured()){toast('⚠️ 未配置 Google Sheet','error');return false;}
    setBusy(true);
    try{
      const res=await fetch(CONFIG.GOOGLE_SCRIPT_URL,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
const raw=await res.text();
      let data=null;try{data=JSON.parse(raw);}catch{}
      if(!data){toast('後端未回傳 JSON（請檢查部署權限是否為「任何人」）','error');return false;}
      if(data.ok===true||data.success===true||data.result==='success')return true;      toast(`操作失敗: ${data.error||JSON.stringify(data)}`,'error');return false;
    }catch(e){toast(`網絡錯誤: ${e.message}`,'error');return false;}
    finally{setBusy(false);}
  }
  function validate(){
    if(!title.trim()){toast('請輸入任務標題','warning');return false;}
    if(!videoId.trim()){toast('請輸入影片 ID','warning');return false;}
    if(!dueDate){toast('派發任務必須設定截止日期','warning');return false;}
    for(let i=0;i<questions.length;i++){
      const q=questions[i];
      if(!q.text.trim()){toast(`第 ${i+1} 題缺少題目文字`,'warning');return false;}
      if(q.type==='mcq'&&q.options.filter(o=>o.trim()).length<2){toast(`第 ${i+1} 題至少需 2 個選項`,'warning');return false;}
    }
    return true;
  }
  function buildLesson(id){
    return {id,topic,title:title.trim(),description:description.trim(),videoId:videoId.trim(),
      dueDate,estimatedMin:Number(estimatedMin)||0,targetForm:targetForm.trim()||'All',
      questions:questions.map((q,i)=>({id:q.id||`q${i+1}`,type:q.type,text:q.text.trim(),
        options:q.type==='mcq'?q.options.map(o=>o.trim()).filter(o=>o!==''):[],answer:String(q.answer||'')}))};
  }
  async function handleCreate(){
    if(!validate())return;
    const ok=await post({action:'createLesson',lesson:buildLesson(`lesson_${Date.now()}`),
      createdBy:userName,createdAt:new Date().toISOString()});
    if(ok){toast('🎉 任務發佈成功，已同步 Google Sheet','success');resetForm();
      await refetchLessons();setTab('status');}
  }
  async function handleUpdate(){
    if(!validate())return;
    const ok=await post({action:'updateLesson',lessonId:editingId,lesson:buildLesson(editingId),
      updatedBy:userName,updatedAt:new Date().toISOString()});
    if(ok){toast('✅ 任務更新成功','success');resetForm();await refetchLessons();setTab('status');}
  }
  async function handleDelete(id,t){
    if(!window.confirm(`確定刪除「${t}」？此操作不可復原。`))return;
    const ok=await post({action:'deleteLesson',lessonId:id,deletedBy:userName,deletedAt:new Date().toISOString()});
    if(ok){toast('🗑️ 任務已刪除','success');await refetchLessons();}
  }

  return (<div className="w-full max-w-2xl"><div className="glass-panel rounded-3xl shadow-xl overflow-hidden flex flex-col" style={{maxHeight:'95vh'}}>
    <div className="hero-gradient p-5 text-white relative flex-shrink-0">
      <div className="flex items-center gap-3 relative">
        <button onClick={onBack} className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center"><i className="fas fa-arrow-left"></i></button>
        <div><h2 className="font-bold text-lg"><i className="fas fa-bullhorn mr-2"></i>任務管理中心</h2>
          <p className="text-xs text-white/80">建立／編輯課題與題目，並追蹤完成情況</p></div></div>
    </div>
    <div className="px-5 pt-4 pb-2 flex-shrink-0">
      <div className="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-xl">
        <button onClick={()=>setTab('create')} className={`flex-1 py-2 text-sm font-bold rounded-lg ${tab==='create'?'bg-white dark:bg-gray-600 text-indigo-600 shadow-sm':'text-gray-500'}`}>
          <i className="fas fa-plus-circle mr-1"></i>{editingId?'編輯任務':'發佈新任務'}</button>
        <button onClick={()=>setTab('status')} className={`flex-1 py-2 text-sm font-bold rounded-lg ${tab==='status'?'bg-white dark:bg-gray-600 text-indigo-600 shadow-sm':'text-gray-500'}`}>
          <i className="fas fa-chart-pie mr-1"></i>已派發 ({analytics.lessonStats.length})</button></div>
    </div>
    <div className="flex-1 overflow-y-auto custom-scrollbar p-5">
      {tab==='create'?(<div className="space-y-4">
        <div className="p-3 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-xl text-xs text-blue-700 dark:text-blue-300">
          <i className="fas fa-cloud-upload-alt mr-1"></i>發佈後即時同步 Google Sheet，所有學生設備自動載入；學生觀看數據亦會即時回傳。</div>
        <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5"><i className="fas fa-film text-indigo-500 mr-1"></i>選擇教學影片</label>
          <select value={videoSel} onChange={e=>{
            const v=e.target.value;setVideoSel(v);
            if(v==='custom'){setVideoId('');setTitle('');}
            else if(v!==''){const x=uniqueVideos[Number(v)];if(x){setVideoId(x.videoId);setTitle(x.title);setTopic(x.topic);}}
            else{setVideoId('');setTitle('');}}}
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm">
            <option value="">-- 請選擇影片 --</option>
            {uniqueVideos.map((v,i)=><option key={i} value={i}>{v.title}</option>)}
            <option value="custom">➕ 手動輸入全新 YouTube 影片…</option></select></div>
        {(videoSel==='custom'||uniqueVideos.length===0)&&(
          <div className="p-3 bg-gray-50 dark:bg-gray-900/50 rounded-xl border border-gray-200 dark:border-gray-700">
            <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">YouTube 影片 ID</label>
            <input value={videoId} onChange={e=>setVideoId(e.target.value.trim())} placeholder="例如：dQw4w9WgXcQ"
              className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm"/></div>)}
        <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">任務標題</label>
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="選取影片後會自動填入"
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm"/></div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">單元主題</label>
            <select value={topic} onChange={e=>setTopic(e.target.value)}
              className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm">
              {['必修部分','Ch.1 細胞','Ch.4 光合作用','Ch.12 遺傳','E1 人體生理學','E2 生態學','E3 微生物與生物技術','E4 生物技術導論']
                .map(t=><option key={t} value={t}>{t}</option>)}</select></div>
          <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">預計時長（分鐘）</label>
            <input type="number" value={estimatedMin} onChange={e=>setEstimatedMin(e.target.value)}
              className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm"/></div></div>
        <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">任務說明</label>
          <textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="請同學注意觀看重點…"
            className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 h-20 resize-none text-sm"/></div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">派發班級</label>
            <select value={targetForm} onChange={e=>setTargetForm(e.target.value)}
              className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm">
              <option value="All">全體</option>
              <optgroup label="── 按年級 ──"><option value="4">中四（全部班別）</option><option value="5">中五（全部班別）</option><option value="6">中六（全部班別）</option></optgroup>
              <optgroup label="── 中四 ──">{['4A','4B','4C','4D'].map(c=><option key={c} value={c}>{c}班</option>)}</optgroup>
              <optgroup label="── 中五 ──">{['5A','5B','5C','5D'].map(c=><option key={c} value={c}>{c}班</option>)}</optgroup>
              <optgroup label="── 中六 ──">{['6A','6B','6C','6D'].map(c=><option key={c} value={c}>{c}班</option>)}</optgroup>
            </select></div>
          <div><label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1.5">截止日期 <span className="text-red-500">*</span></label>
            <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}
              className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm"/></div></div>

        {/* 題目編輯器 */}
        <div className="border-t border-gray-100 dark:border-gray-700 pt-4">
          <div className="flex items-center justify-between mb-2">
            <label className="text-xs font-bold text-gray-700 dark:text-gray-300"><i className="fas fa-clipboard-question text-indigo-500 mr-1"></i>檢核題目（{questions.length}）</label>
            <div className="flex gap-1.5">
              <button onClick={()=>addQuestion('mcq')} className="text-[11px] px-2 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 font-bold">+ 選擇題</button>
              <button onClick={()=>addQuestion('fill')} className="text-[11px] px-2 py-1 rounded-lg bg-purple-50 dark:bg-purple-900/30 text-purple-600 font-bold">+ 填充題</button></div></div>
          <p className="text-[10px] text-gray-400 mb-2">加入題目後，學生必須觀看至 {CONFIG.VIDEO_UNLOCK_THRESHOLD}% 才解鎖，並須答完才算完成；老師可看到每題答對率。</p>
          <div className="space-y-2">{questions.map((q,i)=>(
            <div key={q.id} className="p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/40">
              <div className="flex items-center gap-2 mb-2">
                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600">Q{i+1}</span>
                <select value={q.type} onChange={e=>updateQ(i,{type:e.target.value,options:e.target.value==='mcq'?(q.options.length?q.options:['','','','']):[],answer:e.target.value==='mcq'?'0':''})}
                  className="text-[11px] px-2 py-1 rounded border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800">
                  <option value="mcq">選擇題</option><option value="fill">填充題</option></select>
                <button onClick={()=>removeQ(i)} className="ml-auto text-red-400 text-xs"><i className="fas fa-trash"></i></button></div>
              <input value={q.text} onChange={e=>updateQ(i,{text:e.target.value})} placeholder="題目文字…"
                className="w-full px-3 py-2 mb-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm"/>
              {q.type==='mcq'?(<div className="space-y-1.5">
                {q.options.map((o,oi)=>(
                  <div key={oi} className="flex items-center gap-2">
                    <input type="radio" name={`ans_${q.id}`} checked={String(q.answer)===String(oi)} onChange={()=>updateQ(i,{answer:String(oi)})}/>
                    <span className="text-[11px] font-bold text-gray-400 w-3">{['A','B','C','D','E'][oi]}</span>
                    <input value={o} onChange={e=>updateQ(i,{options:q.options.map((x,xi)=>xi===oi?e.target.value:x)})}
                      placeholder={`選項 ${['A','B','C','D','E'][oi]}`}
                      className="flex-1 px-2 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-xs"/>
                    {q.options.length>2&&<button onClick={()=>updateQ(i,{options:q.options.filter((_,xi)=>xi!==oi)})} className="text-gray-300 text-xs"><i className="fas fa-times"></i></button>}
                  </div>))}
                {q.options.length<5&&<button onClick={()=>updateQ(i,{options:[...q.options,'']})} className="text-[11px] text-indigo-500 font-bold">+ 增加選項</button>}
                <p className="text-[10px] text-gray-400">請點選左方圓圈設定正確答案</p></div>
              ):(<input value={q.answer} onChange={e=>updateQ(i,{answer:e.target.value})} placeholder="參考答案（會忽略大小寫與空格）"
                className="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm"/>)}
            </div>))}
          </div>
        </div>

        {editingId&&<div className="p-3 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 rounded-xl text-xs text-amber-700 flex items-center justify-between">
          <span><i className="fas fa-pen mr-1"></i>正在編輯已發佈任務</span>
          <button onClick={resetForm} className="font-bold">取消編輯</button></div>}
        <button onClick={editingId?handleUpdate:handleCreate} disabled={busy}
          className={`w-full py-3 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2 ${busy?'bg-gray-400':editingId?'bg-gradient-to-r from-amber-500 to-orange-500':'bg-gradient-to-r from-indigo-500 to-purple-600'}`}>
          {busy?<><i className="fas fa-spinner fa-spin"></i>處理中…</>:editingId?<><i className="fas fa-save"></i>確認更新任務</>:<><i className="fas fa-paper-plane"></i>確認發佈任務</>}</button>
      </div>):(
        <AssignedLessonsView lessonStats={analytics.lessonStats} onEdit={loadForEdit} onDelete={handleDelete}/>
      )}
    </div>
  </div></div>);
}

function AssignedLessonsView({lessonStats,onEdit,onDelete}){
  const [grade,setGrade]=useState('all');
  const filtered=useMemo(()=>{
    if(grade==='all')return lessonStats;
    if(grade==='ALL_G')return lessonStats.filter(s=>String(s.lesson.targetForm||'All').toUpperCase()==='ALL');
    return lessonStats.filter(s=>{const tf=String(s.lesson.targetForm||'').toUpperCase();return tf!=='ALL'&&tf[0]===grade;});
  },[lessonStats,grade]);
  if(!lessonStats.length)return <EmptyState icon="📭" title="尚無已派發任務" subtitle="切換到「發佈新任務」開始建立。"/>;
  return (<div className="space-y-3">
    <div className="flex gap-1.5 flex-wrap">
      {[['all','全部'],['4','中四'],['5','中五'],['6','中六'],['ALL_G','全體']].map(([k,l])=>(
        <button key={k} onClick={()=>setGrade(k)}
          className={`text-xs px-3 py-1.5 rounded-full font-bold border ${grade===k?'bg-indigo-600 text-white border-indigo-600':'bg-white dark:bg-gray-800 text-gray-500 border-gray-200 dark:border-gray-600'}`}>{l}</button>))}
    </div>
    {filtered.map(s=><AssignedLessonCard key={s.lesson.id} stat={s} onEdit={onEdit} onDelete={onDelete}/>)}
  </div>);
}

function AssignedLessonCard({stat,onEdit,onDelete}){
  const [open,setOpen]=useState(false);
  const {lesson,rows,started,completed,notStarted,completionRate,avgWatch,avgScore}=stat;
  const totalQ=lesson.questions?.length||0;
  const started_rows=rows.filter(r=>(r.p?.watchPct||0)>0).sort((a,b)=>(b.p?.watchPct||0)-(a.p?.watchPct||0));
  return (<div className="rounded-2xl border border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden card-elevation">
    <div className="p-4">
      <div className="flex justify-between items-start gap-2 mb-2">
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-1.5 flex-wrap mb-1">
            <span className="text-[10px] bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 px-2 py-0.5 rounded-md font-bold">{lesson.topic}</span>
            <span className="text-[10px] bg-amber-100 dark:bg-amber-900/50 text-amber-700 px-2 py-0.5 rounded-md font-bold"><i className="fas fa-users mr-0.5"></i>{lesson.targetForm}</span>
            {lesson.dueDate&&<span className={`text-[10px] px-2 py-0.5 rounded-md ${isOverdue(lesson.dueDate)?'text-red-500 bg-red-50 dark:bg-red-900/20':'text-gray-400 bg-gray-50 dark:bg-gray-900'}`}>截止 {lesson.dueDate}</span>}
            {totalQ>0&&<span className="text-[10px] bg-purple-50 dark:bg-purple-900/30 text-purple-600 px-2 py-0.5 rounded-md font-bold">{totalQ} 題</span>}
          </div>
          <h3 className="font-bold text-gray-800 dark:text-gray-100 text-sm line-clamp-1">{lesson.title}</h3></div>
        <div className="text-right flex-shrink-0">
          <div className="text-2xl font-extrabold bg-gradient-to-r from-green-500 to-emerald-500 bg-clip-text text-transparent">{completionRate}%</div>
          <div className="text-[9px] text-gray-400 -mt-1">完成率</div>
          <div className="flex gap-1 mt-1">
            <button onClick={()=>onEdit(lesson)} className="text-[10px] px-2 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 font-bold"><i className="fas fa-pen text-[9px] mr-0.5"></i>編輯</button>
            <button onClick={()=>onDelete(lesson.id,lesson.title)} className="text-[10px] px-2 py-1 rounded-lg bg-red-50 dark:bg-red-900/30 text-red-500 font-bold"><i className="fas fa-trash text-[9px] mr-0.5"></i>刪除</button></div></div></div>
      <div className="grid grid-cols-4 gap-2 mb-2.5">
        {[['已開始',started,'blue'],['已完成',completed,'green'],['未開始',notStarted.length,'red'],['平均觀看',fmtPct(avgWatch),'amber']].map(([l,v,c])=>(
          <div key={l} className={`bg-${c}-50 dark:bg-${c}-900/20 rounded-lg p-2 text-center`}>
            <div className={`text-[10px] text-${c}-500 font-medium`}>{l}</div>
            <div className={`text-base font-extrabold text-${c}-600 dark:text-${c}-400`}>{v}</div></div>))}
      </div>
      <div className="h-2 bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden mb-2.5">
        <div className="h-full bg-gradient-to-r from-green-400 to-emerald-500 rounded-full" style={{width:`${completionRate}%`}}/></div>
      <button onClick={()=>setOpen(o=>!o)} className="w-full text-xs py-1.5 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-500 font-bold">
        <i className={`fas fa-chevron-${open?'up':'down'} text-[10px] mr-1`}></i>{open?'收起詳情':`查看詳細追蹤（${rows.length} 人）`}</button>
    </div>
    {open&&(<div className="border-t border-gray-100 dark:border-gray-700">
      {started_rows.length>0&&(<div className="p-3">
        <p className="text-[11px] font-bold text-gray-400 mb-2"><i className="fas fa-play-circle text-blue-400 mr-1"></i>已開始（{started_rows.length}）</p>
        <div className="space-y-1.5">{started_rows.map(({student,p})=>{
          const answered=p?.answers?Object.keys(p.answers).length:0;
          return (<div key={student.name} className={`rounded-lg border px-3 py-2 ${p?.completedAt?'border-green-200 dark:border-green-800 bg-green-50/50 dark:bg-green-900/10':'border-gray-100 dark:border-gray-700/50'}`}>
            <div className="flex items-center gap-2">
              <span className="text-sm">{p?.completedAt?'✅':p?.watchPct>=80?'▶️':'👁️'}</span>
              <span className="text-xs font-bold text-gray-700 dark:text-gray-200 flex-1 truncate">{shortenName(student.name)}</span>
              <div className="flex items-center gap-1.5 flex-shrink-0">
                <div className="w-14 h-1.5 bg-gray-200 dark:bg-gray-600 rounded-full overflow-hidden">
                  <div className={`h-full bg-gradient-to-r ${watchPctGradient(p?.watchPct)}`} style={{width:fmtPct(p?.watchPct)}}/></div>
                <span className={`text-[10px] font-bold w-8 text-right ${watchPctColor(p?.watchPct)}`}>{fmtPct(p?.watchPct)}</span>
                {totalQ>0&&<span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${answered>=totalQ?'bg-green-100 text-green-700':'bg-gray-100 dark:bg-gray-700 text-gray-500'}`}>{answered}/{totalQ}</span>}
              </div></div></div>);})}
        </div></div>)}
      {notStarted.length>0&&(<div className="p-3 bg-red-50/30 dark:bg-red-900/10 border-t border-gray-50 dark:border-gray-700/50">
        <p className="text-[11px] font-bold text-red-400 mb-2"><i className="fas fa-eye-slash mr-1"></i>未開始（{notStarted.length}）</p>
        <div className="flex flex-wrap gap-1.5">{notStarted.map(n=>(
          <span key={n} className="text-[11px] bg-red-100 dark:bg-red-900/30 text-red-600 px-2 py-0.5 rounded-full font-medium border border-red-200 dark:border-red-800/50">{shortenName(n)}</span>))}
        </div></div>)}
    </div>)}
  </div>);
}

/* ===================== 主程式 ===================== */
function FlippedClassroomApp(){
  const toast=useToast();
  const [userName,setUserName]=useState(()=>localStorage.getItem(CONFIG.STORAGE.username)||'');
  const [isGuest,setIsGuest]=useState(false);
  const [isDark,setIsDark]=useState(()=>localStorage.getItem(CONFIG.STORAGE.darkMode)==='true');
  const [screen,setScreen]=useState('home');
  const [activeLesson,setActiveLesson]=useState(null);
  const [activeStudent,setActiveStudent]=useState(null);
  const [dashTab,setDashTab]=useState('overview');
  const [previewStudent,setPreviewStudent]=useState(null);

  const {lessons,loading:lessonsLoading,error:lessonsError,syncing:lessonsSyncing,refetchLessons}=useLessons();
  const effectiveUser=previewStudent||userName;
  const {allProgress,loading,error,syncing:progressSyncing,lastSync,submitProgress,getProgress,refetch}=useProgressData(effectiveUser);
  const {users:registeredUsers,userMap,refetchUsers}=useRegisteredUsers(userName);
  const analytics=useAnalytics(lessons,allProgress,registeredUsers,userMap);

  useEffect(()=>{if(userName&&userName!=='訪客 (未登入)')registerUserOnLogin(userName);},[userName]);
  useEffect(()=>{document.documentElement.classList.toggle('dark',isDark);
    localStorage.setItem(CONFIG.STORAGE.darkMode,isDark);},[isDark]);
  useEffect(()=>{
    if(!userName){localStorage.removeItem(CONFIG.STORAGE.username);setIsGuest(false);setScreen('home');setPreviewStudent(null);}
    else localStorage.setItem(CONFIG.STORAGE.username,userName);
  },[userName]);
  useEffect(()=>{if(error)toast(`進度同步警告：${error}`,'warning',4000);},[error]);

  /* 教師畫面自動刷新 */
  useEffect(()=>{
    if(!isTeacher(userName))return;
    if(!['teacher_dashboard','teacher_lesson_report','teacher_student'].includes(screen))return;
    const t=setInterval(()=>{refetch();},CONFIG.TEACHER_REFRESH_MS);
    return ()=>clearInterval(t);
  },[screen,userName,refetch]);

  const previewMode=!!previewStudent;
  const currentIsAssignment=activeLesson&&!previewMode&&effectiveUser&&effectiveUser!=='訪客 (未登入)'
    &&!isTeacher(effectiveUser)&&isAssignedLesson(activeLesson)
    &&matchesTargetForm(activeLesson.targetForm,parseUserForm(effectiveUser));

  const Guard=({children})=>isTeacher(userName)?children:(
    <div className="glass-panel p-8 rounded-2xl shadow-xl text-center max-w-sm">
      <i className="fas fa-lock text-4xl text-red-500 mb-4"></i>
      <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">權限不足</h2>
      <button onClick={()=>setScreen('home')} className="bg-gray-600 text-white px-6 py-2 rounded-lg">返回</button></div>);

  return (<div className={`min-h-screen transition-colors ${isDark?'dark bg-gray-900':'bg-gradient-to-br from-indigo-50 via-purple-50/30 to-blue-50'} flex items-start justify-center p-3 md:p-6 pt-4`}>
    <button onClick={()=>setIsDark(d=>!d)}
      className="fixed top-4 right-4 z-[999] w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-lg border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-yellow-400 flex items-center justify-center">
      <i className={`fas ${isDark?'fa-sun':'fa-moon'} text-lg`}></i></button>

    <AnimatePresence mode="wait">
      {screen==='home'&&(
        <motion.div key="home" initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} exit={{opacity:0,y:-20}} className="w-full flex justify-center">
          <HomeScreen userName={effectiveUser} setUserName={setUserName} setIsGuest={setIsGuest}
            lessons={lessons} lessonsLoading={lessonsLoading} lessonsError={lessonsError} refetchLessons={refetchLessons}
            getProgress={getProgress} allProgress={allProgress}
            onOpenLesson={l=>{setActiveLesson(l);setScreen('lesson');}}
            onOpenTeacher={()=>{setDashTab('overview');setScreen('teacher_dashboard');}}
            onOpenStudents={()=>{setDashTab('students');setScreen('teacher_dashboard');}}
            onOpenAdmin={()=>setScreen('assignment_admin')}
            previewStudent={previewStudent} setPreviewStudent={setPreviewStudent}
            registeredUsers={registeredUsers} lessonsSyncing={lessonsSyncing} progressSyncing={progressSyncing}
            analytics={analytics}/>
        </motion.div>)}

      {screen==='lesson'&&activeLesson&&(
        <motion.div key="lesson" initial={{opacity:0,x:50}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-50}} className="w-full flex justify-center">
          <LessonPlayerScreen lesson={activeLesson} userName={effectiveUser}
            initialProgress={getProgress(activeLesson.id,effectiveUser)}
            onSaveProgress={(id,rec,opts)=>submitProgress(id,rec,opts)}
            onBack={()=>setScreen('home')} isAssignment={!!currentIsAssignment} previewMode={previewMode}/>
        </motion.div>)}

      {screen==='teacher_dashboard'&&(
        <motion.div key="tdash" initial={{opacity:0,x:50}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-50}} className="w-full flex justify-center">
          <Guard><TeacherDashboardScreen analytics={analytics} lessons={lessons} allProgress={allProgress}
            loading={loading||progressSyncing} lastSync={lastSync} initialTab={dashTab}
            onBack={()=>setScreen('home')}
            onRefresh={()=>{refetch();refetchUsers();refetchLessons();}}
            onViewLessonReport={l=>{setActiveLesson(l);setScreen('teacher_lesson_report');}}
            onViewStudent={n=>{setActiveStudent(n);setScreen('teacher_student');}}/></Guard>
        </motion.div>)}

      {screen==='teacher_lesson_report'&&activeLesson&&(
        <motion.div key="treport" initial={{opacity:0,x:50}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-50}} className="w-full flex justify-center">
          <Guard><TeacherLessonReportScreen lesson={activeLesson} analytics={analytics}
            onBack={()=>setScreen('teacher_dashboard')}
            onViewStudent={n=>{setActiveStudent(n);setScreen('teacher_student');}}/></Guard>
        </motion.div>)}

      {screen==='teacher_student'&&activeStudent&&(
        <motion.div key="tstudent" initial={{opacity:0,x:50}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-50}} className="w-full flex justify-center">
          <Guard><TeacherStudentDetailScreen studentName={activeStudent} analytics={analytics}
            onBack={()=>setScreen('teacher_dashboard')}
            onViewLessonReport={l=>{setActiveLesson(l);setScreen('teacher_lesson_report');}}/></Guard>
        </motion.div>)}

      {screen==='assignment_admin'&&(
        <motion.div key="aadmin" initial={{opacity:0,x:50}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-50}} className="w-full flex justify-center">
          <Guard><AssignmentAdminScreen userName={userName} onBack={()=>setScreen('home')}
            refetchLessons={refetchLessons} lessons={lessons} analytics={analytics}/></Guard>
        </motion.div>)}
    </AnimatePresence>
  </div>);
}

function Root(){return (<ToastProvider><FlippedClassroomApp/></ToastProvider>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
